<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hexagon shape (subtle) -->
  <polygon points="50,12 85,32 85,72 50,92 15,72 15,32" fill="none" stroke="url(#tealGrad)" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Outer power transmission network structure -->
  <line x1="50" y1="12" x2="50" y2="40" stroke="url(#tealGrad)" stroke-width="2.5" />
  <line x1="15" y1="72" x2="40" y2="58" stroke="url(#tealGrad)" stroke-width="2.5" />
  <line x1="85" y1="72" x2="60" y2="58" stroke="url(#tealGrad)" stroke-width="2.5" />
  
  <!-- Central energy node (glowing) -->
  <circle cx="50" cy="50" r="10" fill="url(#tealGrad)" filter="url(#glow)" />
  
  <!-- Floating gold particles (sustainability/renewables) -->
  <circle cx="50" cy="25" r="4.5" fill="url(#goldGrad)" />
  <circle cx="28" cy="65" r="4.5" fill="url(#goldGrad)" />
  <circle cx="72" cy="65" r="4.5" fill="url(#goldGrad)" />
  
  <!-- Inner lightning path / dynamic energy flow -->
  <path d="M 50 43 L 46 51 L 54 51 L 50 58" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
